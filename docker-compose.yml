version: '3.8'

# Volumes для постоянного хранения
volumes:
  n8n_storage:
    name: n8n_storage
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config

# Кастомная сеть
networks:
  n8n-network:
    name: n8n-network
    driver: bridge

# Общий шаблон для n8n сервисов
x-n8n: &service-n8n
  image: n8nio/n8n:latest
  networks: ['n8n-network']
  environment:
    # Database configuration
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_PORT=5432
    - DB_POSTGRESDB_USER=${POSTGRES_USER}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
    
    # n8n configuration
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_PERSONALIZATION_ENABLED=false
    - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET}
    - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
    
    # Webhook и URL configuration
    - N8N_HOST=${N8N_HOST}
    - N8N_PROTOCOL=https
    - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL}
    - WEBHOOK_URL=${WEBHOOK_URL}
    
    # Timezone
    - TZ=${TZ:-Europe/Moscow}
    
    # Binary data storage
    - N8N_USER_FOLDER=/home/node/.n8n
    
    # Optional: Ollama integration
    - OLLAMA_HOST=${OLLAMA_HOST:-ollama:11434}
  env_file:
    - .env

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    hostname: postgres
    networks: ['n8n-network']
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=${TZ:-Europe/Moscow}
    volumes:
      # Данные сохраняются на хосте в ./data/postgres
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      # Опционально: открыть порт PostgreSQL для внешних подключений (только для разработки)
      - "5432:5432"

  # Импорт начальных данных (опционально)
  n8n-import:
    <<: *service-n8n
    container_name: n8n-import
    hostname: n8n-import
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        if [ -d "/demo-data/credentials" ] && [ -d "/demo-data/workflows" ]; then
          echo "Importing credentials and workflows..."
          n8n import:credentials --separate --input=/demo-data/credentials || true
          n8n import:workflow --separate --input=/demo-data/workflows || true
          echo "Import completed"
        else
          echo "No demo data found, skipping import"
        fi
    volumes:
      - ./n8n/demo-data:/demo-data:ro
      - n8n_storage:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Основной n8n сервис
  n8n:
    <<: *service-n8n
    container_name: n8n
    hostname: n8n
    restart: unless-stopped
    expose:
      - "5678"
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./shared:/data/shared
      - ./n8n/demo-data:/demo-data:ro
    depends_on:
      postgres:
        condition: service_healthy
      n8n-import:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '--spider', 'http://localhost:5678/healthz']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Caddy reverse proxy with automatic HTTPS
  caddy:
    image: caddy:2-alpine
    container_name: n8n-caddy
    hostname: caddy
    networks: ['n8n-network']
    restart: unless-stopped
    ports:
      - "80:80"   # HTTP (для redirect на HTTPS)
      - "443:443" # HTTPS
      - "443:443/udp" # HTTP/3 (QUIC)
    environment:
      - N8N_DOMAIN=${N8N_HOST}
      - ACME_EMAIL=admin@${N8N_HOST}  # Email для Let's Encrypt уведомлений
    volumes:
      - ./caddy/Caddyfile.server:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      n8n:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:2019/config/']
      interval: 30s
      timeout: 10s
      retries: 3